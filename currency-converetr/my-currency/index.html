<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>Currency Converter
            <div class="currency-container">
                <select id="currency-first">
                    <option value="USD" selected>USD</option>
                    <option value="KZT">KZT</option>
                    <option value="RUB">RUB</option>
                    <option value="EUR">EUR</option>
                    <option value="GBP">GBP</option>
                    <option value="CNY">CNY</option>
                    <option value="JPY">JPY</option>
                    <option value="CAD">CAD</option>
                    <option value="AUD">AUD</option>
                    <option value="CHF">CHF</option>
                    <option value="INR">INR</option>
                    <option value="AED">AED</option>
                    <option value="TRY">TRY</option>
                    <option value="KGS">KGS</option>
                    <option value="BYN">BYN</option>
                    <option value="UAH">UAH</option>
                    <option value="PLN">PLN</option>
                    <option value="CZK">CZK</option>
                    <option value="THB">THB</option>
                    <option value="KRW">KRW</option>
                    <option value="SGD">SGD</option>
                    <option value="AZN">AZN</option>
                    <option value="GEL">GEL</option>
                    <option value="HKD">HKD</option>
                    <option value="BRL">BRL</option>
                    <option value="MXN">MXN</option>
                    <option value="ZAR">ZAR</option>



                </select>
                <input type="number" id="worth-first" value="1" min="0" step="any">

            </div>
            <div class="currency-container">
                <select id="currency-second">
                    <option value="KZT" selected>KZT</option>
                    <option value="USD">USD</option>
                    <option value="RUB">RUB</option>
                    <option value="EUR">EUR</option>
                    <option value="GBP">GBP</option>
                    <option value="CNY">CNY</option>
                    <option value="JPY">JPY</option>
                    <option value="CAD">CAD</option>
                    <option value="AUD">AUD</option>
                    <option value="CHF">CHF</option>
                    <option value="INR">INR</option>
                    <option value="AED">AED</option>
                    <option value="TRY">TRY</option>
                    <option value="KGS">KGS</option>
                    <option value="BYN">BYN</option>
                    <option value="UAH">UAH</option>
                    <option value="PLN">PLN</option>
                    <option value="CZK">CZK</option>
                    <option value="THB">THB</option>
                    <option value="KRW">KRW</option>
                    <option value="SGD">SGD</option>
                    <option value="AZN">AZN</option>
                    <option value="GEL">GEL</option>
                    <option value="HKD">HKD</option>
                    <option value="BRL">BRL</option>
                    <option value="MXN">MXN</option>
                    <option value="ZAR">ZAR</option>

                    <option value="KZT" selected>KZT</option>
                </select>
                <input type="number" id="worth-second" disabled>

            </div>
            <p class="exchange-rate" id="exchange-rate">1 USD = 445.2628 KZT</p>


    </div>
    </h1>
    </div>
    <script src="index.js"></script>
</body>

</html>
